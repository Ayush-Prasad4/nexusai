name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexusai
          POSTGRES_USER: nexusai
          POSTGRES_PASSWORD: nexusai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexusai -d nexusai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run database migrations
        env:
          NEXUSAI_DATABASE_URL: "postgresql+asyncpg://nexusai:nexusai@localhost:5432/nexusai"
        run: alembic upgrade head

      - name: Initialize LangGraph checkpoint schema
        env:
          NEXUSAI_DATABASE_URL: "postgresql+asyncpg://nexusai:nexusai@localhost:5432/nexusai"
        run: |
          python - <<'PYTHON'
          import asyncio
          from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver

          async def main():
              connection_string = (
                  "postgresql+asyncpg://nexusai:nexusai@localhost:5432/nexusai"
              ).replace("postgresql+asyncpg://", "postgresql://")

              async with AsyncPostgresSaver.from_conn_string(
                  connection_string
              ) as checkpointer:
                  await checkpointer.setup()

          asyncio.run(main())
          PYTHON

      - name: Run tests
        env:
          NEXUSAI_ENVIRONMENT: testing
          NEXUSAI_DATABASE_URL: "postgresql+asyncpg://nexusai:nexusai@localhost:5432/nexusai"
          NEXUSAI_REDIS_URL: "redis://localhost:6379/0"
          NEXUSAI_JWT_SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-characters-long"
        run: pytest -q

      - name: Check formatting
        run: git diff --check

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexusai:ci .

      - name: Verify Docker image
        run: docker image inspect nexusai:ci
